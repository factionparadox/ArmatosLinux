# Armatos foot defaults: night stone, gilt and rubric.
# Your own ~/.config/foot/foot.ini replaces this file entirely.

[main]
font=JetBrains Mono:size=11
pad=14x12
term=foot

[colors]
alpha=0.93
foreground=e8e1d8
background=16110f
selection-foreground=16110f
selection-background=c9a24a
cursor=16110f c9a24a
# black, red, green, yellow, blue, magenta, cyan, white
regular0=2a221e
regular1=b03a2e
regular2=7d8f4e
regular3=d4a72c
regular4=5b7a99
regular5=8f4a6e
regular6=5f9187
regular7=d9d0c3
bright0=5f5650
bright1=e0533f
bright2=a3b56b
bright3=fbbf24
bright4=86a3c3
bright5=b9739a
bright6=86b8ad
bright7=f4ede2

[cursor]
style=beam
blink=yes
