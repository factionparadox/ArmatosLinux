# Your MangoWC settings, Imperator.
#
# This file is read after the Armatos defaults in
# /usr/share/armatos/mango/armatos.conf, so anything set here wins.
# Super+Ctrl+R reloads it. The options are documented at
# https://mangowm.github.io
#
# Examples:
#   focus_color=0x7a0000ff          # rubric red instead of gilt
#   xkb_rules_layout=gb             # British keys only
#   monitor_rule=name:^eDP-1$,scale:1.75
#   bind=SUPER,b,spawn,firefox
