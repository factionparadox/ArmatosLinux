# Armatos Linux: the MangoWC defaults (the castra).
#
# Don't edit this file: an upgrade will replace it. Put your own settings in
# ~/.config/mango/config.conf, which is read after this one and wins.

# ---- Marmor: the look ------------------------------------------------------
# Square-cut stone: no rounded corners. Gilt marks the window in command.
border_px=2
border_radius=0
no_radius_when_single=1
focus_color=0xc9a24aff
border_color=0x3a2f29ff
urgent_color=0x7a0000ff
maximized_screen_color=0xc9a24aff
scratchpad_color=0x5e0e18ff
global_color=0x5e0e18ff
overlay_color=0xc9a24aff
drop_color=0xc9a24a55
split_color=0x7a0000ff
root_color=0x16110fff

gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=12
gap_outer_vertical=12

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=16
shadows_blur=22
shadows_position_x=0
shadows_position_y=8
shadows_color=0x000000a0

# Frosted glass behind see-through windows (the terminal). Layer-surface blur
# stays off: in Mango 0.18.6 with SceneFX 0.5 it can crash the compositor
# when a panel opens, and the shell's stone tablets are opaque anyway.
blur=1
blur_layer=0
blur_optimized=1
blur_params_radius=8
blur_params_num_passes=3
blur_params_noise=0.02
blur_params_brightness=0.85
blur_params_contrast=0.9
blur_params_saturation=1.1

animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.85
animation_duration_open=260
animation_duration_close=220
animation_duration_move=320
animation_duration_tag=300

# The shell's own surfaces: the Titulus and the stone tablets are opaque and
# draw their own shadows, so Mango leaves them alone.
layer_rule=no_blur:1,no_animation:1,no_shadow:1,layer_name:armatos-wallpaper
layer_rule=no_blur:1,no_animation:1,no_shadow:1,layer_name:armatos-titulus
layer_rule=no_blur:1,no_shadow:1,layer_name:armatos-tabula
layer_rule=no_blur:1,no_shadow:1,layer_name:armatos-vale
layer_rule=no_blur:1,no_shadow:1,layer_name:armatos-edicta
layer_rule=no_blur:1,animation_type_open:zoom,animation_type_close:fade,no_shadow:1,layer_name:armatos-launcher
layer_rule=no_blur:1,animation_type_open:fade,animation_type_close:fade,no_shadow:1,layer_name:armatos-praetoriani

# ---- The legion's formation: scrolling columns ---------------------------------
tag_num=9
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller
scroller_proportion_preset=0.33,0.5,0.67,1.0
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_structs=20
focus_on_activate=1
sloppy_focus=1
warp_cursor=0

# colonia (the installer) floats as a tablet rather than a column.
window_rule=is_floating:1,width:0.84,height:0.88,app_id:calamares

# The Colosseum (Super+Tab): every window in the ring, centred and cycled.
overcircle_center_ratio=0.5
overview_gap_inner=12
overview_gap_outer=40

# ---- Input -----------------------------------------------------------------------
# The keyboard layout comes from /etc/default/keyboard (what you chose when
# installing); armatos-session passes it on. British keys if nothing is set.
xkb_rules_layout=gb
repeat_rate=30
repeat_delay=400
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
cursor_size=24

# ---- Starting the session --------------------------------------------------------
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_CONFIG_DIRS MANGO_INSTANCE_SIGNATURE
exec_once=qs -n -c armatos
# Seal the gates after ten idle minutes, and always before sleep.
exec_once=swayidle -w timeout 600 'qs -c armatos ipc call porta lock' before-sleep 'qs -c armatos ipc call porta lock'

# ---- Orders (keybinds) -----------------------------------------------------------
# Workspaces I-IX
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Windows
bind=SUPER,Tab,overcircle,next
bind=SUPER+SHIFT,Tab,overcircle,prev
bind=SUPER,q,killclient
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,r,switch_proportion_preset
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,4,overcircle,next

# The shell
bind=SUPER,space,spawn,qs -c armatos ipc call launcher toggle
bind=SUPER,s,spawn,qs -c armatos ipc call tabula toggle
bind=SUPER,Escape,spawn,qs -c armatos ipc call vale toggle
bind=SUPER,x,spawn,qs -c armatos ipc call porta lock
bind=SUPER,z,spawn,qs -c armatos ipc call porta sleep
bind=SUPER+SHIFT,s,spawn,/usr/lib/armatos/imago region
bind=NONE,Print,spawn,/usr/lib/armatos/imago screen
bind=SUPER+CTRL,r,reload_config

# The household: W browser, T terminal, D Discord, V VLC, E files,
# A ani-cli, P Proton VPN
bind=SUPER,w,spawn,/usr/lib/armatos/arcesse browser
bind=SUPER,t,spawn,/usr/lib/armatos/arcesse terminal
bind=SUPER,Return,spawn,/usr/lib/armatos/arcesse terminal
bind=SUPER,d,spawn,/usr/lib/armatos/arcesse discord
bind=SUPER,v,spawn,/usr/lib/armatos/arcesse video
bind=SUPER,e,spawn,/usr/lib/armatos/arcesse files
bind=SUPER,a,spawn,/usr/lib/armatos/arcesse anime
bind=SUPER,p,spawn,/usr/lib/armatos/arcesse vpn

# Sound, light and song (these work at the porta too)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -q -c backlight set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -q -c backlight set 5%-
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
