# colonia: the Armatos installer (Calamares).
---
modules-search: [ local, /usr/share/armatos/colonia/modules ]

instances:
- id: armatos
  module: shellprocess
  config: shellprocess_armatos.conf
- id: efifallback
  module: shellprocess
  config: shellprocess_efifallback.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - clavis
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - packages
  - shellprocess@armatos
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@efifallback
  - umount
- show:
  - finished

branding: armatos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
