# /etc/default/grub is left mostly alone: the Armatos settings live in
# /etc/default/grub.d/armatos.cfg (from armatos-boot-theme), read after it.
---
overwrite: false
prefer_grub_d: false
keep_distributor: true
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
