---
doAutologin: true
autologinGroup: autologin
setRootPassword: false
doReusePassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - plugdev
    - video
    - render
    - input
    - sudo
    - name: lpadmin
      must_exist: false
      system: true
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, nobody, daemon, bin, sys, sync, games, man, lp, mail, news, uucp, proxy, www-data, backup, list, irc, _apt, messagebus, syslog, polkitd, greeter, _greetd ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "roma"
presets:
    fullName:
        value: "Imperator"
        editable: true
    loginName:
        value: "imperator"
        editable: true
