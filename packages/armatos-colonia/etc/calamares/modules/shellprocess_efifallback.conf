# A fallback loader in EFI/BOOT, for firmware that forgets its boot entries.
# It is shim (so Secure Boot still holds), with shim's own fallback beside it,
# which rebuilds the Armatos entry from EFI/ubuntu/BOOTX64.CSV.
---
dontChroot: false
timeout: 60
script:
    - "-mkdir -p /boot/efi/EFI/BOOT"
    - "-cp /boot/efi/EFI/ubuntu/shimx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI"
    - "-cp /usr/lib/shim/fbx64.efi /boot/efi/EFI/BOOT/fbx64.efi"
    - "-cp /usr/lib/shim/mmx64.efi /boot/efi/EFI/BOOT/mmx64.efi"
