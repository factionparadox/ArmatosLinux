---
showSupportUrl: true
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    # Root takes at least 40 GiB and /boot 2 GiB, so this leaves /home a
    # dozen GiB or more. 56 GiB still lets a "64 GB" drive (59.6 GiB) in.
    requiredStorage: 56
    requiredRam: 2.0
    internetCheckUrl: https://archive.ubuntu.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root
