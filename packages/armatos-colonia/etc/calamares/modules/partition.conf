# The field (ager): an EFI partition, a plain /boot, and the rest LUKS2 with
# Btrfs, which damnatio needs (its subvolumes are set in mount.conf).
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1GiB
    minimumSize: 512MiB
userSwapChoices:
    - none
    - file
initialSwapChoice: file
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
showNotEncryptedBootMessage: false
drawNestedPartitions: true
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs"]
partitionLayout:
    - name: "armatos-boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true
      mountPoint: "/boot"
      size: 2G
    # The system: a quarter of the disk, never less than 40 GiB or more
    # than 128 GiB. damnatio's snapshots live here too.
    - name: "armatos"
      filesystem: btrfs
      mountPoint: "/"
      size: 25%
      minSize: 40GiB
      maxSize: 128GiB
    # /home on its own partition, so the system can be reinstalled or rolled
    # back without touching anyone's work. It is encrypted separately and
    # unlocked at boot by a key kept inside the encrypted root (the clavis
    # step), so the LUKS passphrase is still typed once.
    - name: "armatos-home"
      filesystem: btrfs
      mountPoint: "/home"
      size: 100%
