# Last touches inside the new system.
---
dontChroot: false
timeout: 600
script:
    - "-rm -f /etc/apt/sources.list.d/cdrom.sources"
    - "-update-alternatives --set default.plymouth /usr/share/plymouth/themes/armatos/armatos.plymouth"
    - "-mkdir -p /boot/grub/themes"
    - "-cp -rT /usr/share/grub/themes/armatos /boot/grub/themes/armatos"
