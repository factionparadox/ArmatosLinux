# Armatos boot menu: marble tablet over the Atlas art.
# The theme is copied into /boot by armatos-boot-theme, because GRUB can't read
# inside an encrypted root.
GRUB_THEME=/boot/grub/themes/armatos/theme.txt
GRUB_GFXMODE=1920x1280,1920x1200,1920x1080,auto
GRUB_TERMINAL_OUTPUT=gfxterm
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
GRUB_DISTRIBUTOR="Armatos Linux"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
